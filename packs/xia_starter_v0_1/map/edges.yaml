# Undirected location adjacencies. The loader registers each edge in both
# directions, exactly like world-geography.connect_locations does, so a pack
# never needs to author the reverse row and can never create an asymmetric map.
#
# distance is abstract kilometres; terrain_cost is a positive multiplier that
# later travel and logistics modules may consume. Nothing reads it yet.
