<style>*{box-sizing:border-box}body{margin:0;background:#18221d;color:#e3e6d9;font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1800px;padding:14px 20px;margin:auto}h1{font-size:21px;font-weight:600;margin:0 0 5px}p{margin:0 0 10px;color:#b1c1b0}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0}button,select{font:inherit;min-height:42px;padding:7px 13px;border:1px solid #55694e;border-radius:6px;background:#2d3d30;color:inherit;cursor:pointer}.status{font-size:13px;margin-left:auto;color:#cad5b9}.frame{max-width:100%;overflow:auto;background:#111c16;border:1px solid #384d3c}.frame:fullscreen{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;border:0}.wrap{display:table;position:relative;margin:auto}canvas{display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}.panel{position:absolute;bottom:14px;right:14px;z-index:2;width:240px;padding:12px;background:#1f2f24ef;border:1px solid #8b9e78;border-radius:7px}.panel p{font-size:12px;margin:4px 0 8px}.panel[hidden]{display:none}.panel .row{display:flex;gap:8px}.note{font-size:13px;margin-top:10px}.links{display:flex;gap:18px;flex-wrap:wrap}a{color:#d5dfa8}details{margin-top:20px}summary{cursor:pointer;color:#c8d3ba}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare img{max-width:100%;display:block;margin-top:8px}.compare figure{margin:10px 0}.compare figcaption{font-size:13px;color:#aebeaa}@media(max-width:700px){main{padding:10px}h1{font-size:18px}.status{width:100%;margin:0}p{font-size:13px}button,select{font-size:13px;padding:7px 9px}.compare{grid-template-columns:1fr}}.toast{position:absolute;z-index:3;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 14px;border:1px solid #8c9b6b;border-radius:6px;background:#223220ed;color:#efe9ce;pointer-events:none}.toast[hidden]{display:none}

body{overflow:hidden}main{max-width:none;padding:0;height:100dvh}main>h1,main>p,main>.links,main>details{display:none}

.toolbar[hidden]{display:none}#settings{position:fixed;right:12px;top:12px;z-index:6;width:40px;min-height:36px;padding:0;background:#1d2a2277;border-color:#74836255;font-size:24px}

<main><h1>林缘庭院 · 动态精进 v8</h1><p>保留 v6 构图与配色。点道路行走，点选花草采摘；需要调整布局时开启摆放。</p>
