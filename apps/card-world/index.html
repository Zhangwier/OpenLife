<!doctype html>
<html lang="zh-CN">
<head>
<base href="/card-world/">
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-store" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>开放人生 · 卡牌世界</title>
<link rel="stylesheet" href="style.css?v=29" />
</head>
<body>
<main class="table" id="table" aria-label="世界：点空地走过去，拖动空地移动地图">
  <div class="world" id="world">
    <canvas class="ground" id="ground"></canvas>
    <canvas class="tide" id="tide"></canvas>
    <div class="layer" id="cards"></div>
    <canvas class="fog" id="fog"></canvas>
    <i class="route-pin" id="routePin" hidden aria-hidden="true"></i>
    <svg class="aim" id="aim"><circle id="aimRange" r="0" /><line id="aimLine" x1="0" y1="0" x2="0" y2="0" /></svg>
  </div>
  <div class="room" id="room" hidden><div class="room-world" id="roomWorld"></div></div>
  <canvas class="dark" id="dark"></canvas>
  <div class="weather" id="weatherLayer"></div>
  <canvas class="snowfall" id="snowfall" hidden></canvas>
</main>

<header class="hud-l">
  <div class="clock"><i id="sun"></i><b id="season">冬</b><span class="wx" id="weather">晴</span><span id="day">第 1 天</span><em id="time">06:00</em><s class="dayline" id="dayline" aria-hidden="true"></s></div>
  <div class="speed" id="speed">
    <button data-speed="0" title="暂停（空格）">❚❚</button>
    <button data-speed="1" class="on" title="正常">▶</button>
    <button data-speed="2" title="快">▶▶</button>
    <button data-speed="4" title="很快">▶▶▶</button>
  </div>
  <div class="goal" id="goal" hidden><b id="goalHead">下一步</b><span id="goalText"></span><button id="goalSkip" title="不用引导了" aria-label="跳过引导">✕</button></div>
</header>
<nav class="hud-r">
  <button id="zoomOut" title="缩小">－</button>
  <button id="zoomIn" title="放大">＋</button>
  <button id="findMe" title="回到自己身边">◎</button>
  <button id="craftBook" title="你会的手艺">✎</button>
  <button id="villageBtn" title="村子：成长、村里的人、村史">村</button>
  <button id="logBtn" title="最近发生的事">记</button>
  <button id="soundBtn" title="声音">♪</button>
  <button id="help" title="操作与存档">?</button>
</nav>
<section class="me" id="me" aria-label="你">
  <button class="me-face" id="meFace" title="点一下：接着做刚才那件事"></button>
  <span class="me-name" id="meName"></span>
  <div class="me-gauges"><span class="g" id="barFood"><b></b></span><span class="g" id="barRest"><b></b></span></div>
  <div class="me-carry" id="meCarry"></div>
  <div class="me-recent" id="meRecent"></div>
  <div class="me-promises" id="mePromises"></div>
  <button class="party-toggle" id="partyToggle" title="听你安排的人和狗：点一下展开" hidden></button>
</section>
<div class="party" id="party" hidden></div>
<button class="auto-me" id="autoMe" title="立即自动行动" aria-label="自动行动" aria-pressed="false">⟳</button>
<div class="detail" id="detail" hidden></div>
<div class="crafts-book" id="crafts" hidden></div>
<div class="crafts-book village-book" id="villageBook" hidden></div>
<div class="namer" id="namer" hidden><b>给它起个名字</b><input id="nameInput" maxlength="12" /><button class="act" id="nameOk">就叫这个</button></div>
<div class="banner" id="banner" hidden></div>
<div class="toast" id="toast"></div>
<div class="crafts-book log-book" id="logBook" hidden></div>
<div class="crafts-book sound-book" id="soundBook" hidden></div>
<div class="title" id="title" hidden>
  <div class="title-card">
    <h1>开放人生</h1>
    <p class="title-sub">河谷里，一户人家的几代人</p>
    <p class="title-note" id="titleNote"></p>
    <button class="title-go" id="titleGo">继续</button>
    <button id="titleNew">新的一生</button>
    <button id="titleHelp">怎么玩</button>
  </div>
</div>
<div class="helpbox" id="helpbox" hidden>
  <b>操作与存档</b>
  <p>点空地或点一张牌，自己找路走过去。也可以直接拖「你」：放在哪就停在哪，路上的时间照算。近处的东西可以直接拖。</p>
  <p>村民心里想什么看不到：在旁边能听见他们念叨，熟了以后点「在忙啥」才会跟你说。</p>
  <p>拖动空地挪地图，滚轮缩放。空格暂停或继续。</p>
  <p>右下角「⟳」立即开启或停止自动行动。同类叠牌可以整叠拖，点开也能单拿一份。</p>
  <p>难度：<select id="difficulty"><option>安稳</option><option selected>寻常</option><option>艰难</option></select> 只改意外（耗子、发烧、寒潮、失火、吵架）来得多勤、有多重。</p>
  <p class="save-row">每隔一会儿自动存档，刷新或关掉页面都能接着玩。
    <button id="lifeExport">导出存档</button><button id="lifeImport">导入存档</button><button id="lifeNew">重新开始</button><button id="lifeBack" hidden>找回上一段人生</button><input type="file" id="lifeFile" accept=".json,application/json" hidden></p>
  <button id="helpClose">知道了</button>
</div>
<script type="module" src="app.js?v=35"></script>
</body>
</html>
