<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
      <defs>
        <radialGradient id="tc_flame" cx="38%" cy="40%" r="65%">
          <stop offset="0%" stop-color="#fff5cc"/>
          <stop offset="30%" stop-color="#f5ba42"/>
          <stop offset="70%" stop-color="#df6e25"/>
          <stop offset="100%" stop-color="#a83614"/>
        </radialGradient>
      </defs>
      <!-- 阴影 -->
      <ellipse cx="128" cy="222" rx="68" ry="16" fill="#2d1c14" opacity="0.4"/>
      <!-- 木柄：斜向支撑的粗壮结实原木棒 -->
      <path d="M 112,118 L 138,112 L 148,222 L 120,224 Z" fill="#7a5230" stroke="#3a2c20" stroke-width="5.5" stroke-linejoin="round"/>
      <path d="M 125,125 L 132,215" stroke="#52341c" stroke-width="3" stroke-linecap="round"/>
      <!-- 顶部麻绳细密多圈缠绕紧扎 -->
      <rect x="104" y="98" width="44" height="26" rx="4" fill="#c9a46a" stroke="#3a2c20" stroke-width="4.5"/>
      <line x1="104" y1="106" x2="148" y2="106" stroke="#8a6a3e" stroke-width="2.5"/>
      <line x1="104" y1="116" x2="148" y2="116" stroke="#8a6a3e" stroke-width="2.5"/>
      <!-- 捆扎在顶端的易燃干草与浸油松脂裹头 -->
      <ellipse cx="126" cy="94" rx="28" ry="16" fill="#4d321d" stroke="#3a2c20" stroke-width="4.5"/>
      <!-- 腾腾燃烧的火光外焰（富有动势的大火苗，高度从 28 到 102） -->
      <path d="M 98,102 C 72,78 78,48 102,32 C 114,48 118,36 128,24 C 145,45 168,36 172,55 C 176,75 165,92 154,102 C 142,112 110,114 98,102 Z" fill="url(#tc_flame)" stroke="#3a2c20" stroke-width="5.5" stroke-linejoin="round"/>
      <!-- 明亮内焰核心 -->
      <path d="M 110,95 C 95,78 105,58 116,48 C 124,58 132,52 135,42 C 148,58 152,75 142,95 C 132,102 118,102 110,95 Z" fill="#fff8db" stroke="#3a2c20" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- 飞溅的微小火星与红屑 -->
      <circle cx="78" cy="38" r="4.5" fill="#f5ba42" stroke="#3a2c20" stroke-width="1.8"/>
      <circle cx="178" cy="28" r="4" fill="#df6e25" stroke="#3a2c20" stroke-width="1.8"/>
      <circle cx="152" cy="14" r="3" fill="#f5ba42" stroke="#3a2c20" stroke-width="1.5"/>
      <!-- 木柄受光高光 -->
      <path d="M 116,132 L 122,212" stroke="#a6764c" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    </svg>