<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
      <defs>
        <radialGradient id="lg_bark" cx="30%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#916038"/>
          <stop offset="60%" stop-color="#69401f"/>
          <stop offset="100%" stop-color="#3d210b"/>
        </radialGradient>
        <radialGradient id="lg_rings" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e8c792"/>
          <stop offset="70%" stop-color="#c99f65"/>
          <stop offset="100%" stop-color="#8f6530"/>
        </radialGradient>
      </defs>
      <!-- 阴影 -->
      <ellipse cx="135" cy="216" rx="95" ry="22" fill="#2d1c14" opacity="0.45"/>
      <!-- 圆木横卧躯干 -->
      <path d="M 68,105 L 205,82 C 220,95 220,175 205,188 L 68,210 Z" fill="url(#lg_bark)" stroke="#3a2c20" stroke-width="6" stroke-linejoin="round"/>
      <!-- 树皮裂纹 -->
      <line x1="95" y1="125" x2="185" y2="110" stroke="#3a2c20" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="88" y1="165" x2="192" y2="150" stroke="#3a2c20" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 树干截面 (左端同心年轮) -->
      <ellipse cx="68" cy="158" rx="36" ry="52" fill="url(#lg_rings)" stroke="#3a2c20" stroke-width="6"/>
      <!-- 年轮圈 (同心椭圆) -->
      <ellipse cx="68" cy="158" rx="26" ry="38" fill="none" stroke="#3a2c20" stroke-width="3.5"/>
      <ellipse cx="68" cy="158" rx="16" ry="24" fill="none" stroke="#3a2c20" stroke-width="3"/>
      <ellipse cx="68" cy="158" rx="7" ry="10" fill="#3a2c20"/>
      <!-- 年轮径向干裂缝 -->
      <path d="M 68,158 L 92,142 M 68,158 L 74,195 M 68,158 L 46,165" stroke="#3a2c20" stroke-width="3" stroke-linecap="round"/>
    </svg>