      <path d="M 72,130 Q 82,126 90,132" fill="none" stroke="#3a2c20" stroke-width="3" stroke-linecap="round"/>
      <circle cx="82" cy="133" r="3" fill="#e66025"/>
      <circle cx="82" cy="133" r="1.5" fill="#3a2c20"/>
      <!-- 野猪粗耳 -->
      <path d="M 105,118 Q 112,98 120,105 Q 115,122 105,125 Z" fill="url(#b_body)" stroke="#3a2c20" stroke-width="4"/>
    </svg>