      <!-- 远侧前腿 -->
      <path d="M 98,175 L 94,216 L 82,217 L 86,182 Z" fill="#36251b" stroke="#3a2c20" stroke-width="4.5"/>
      <!-- 躯体 (高高耸立的背部驼峰) -->
