      <ellipse cx="50" cy="155" rx="10" ry="14" fill="#543e30" stroke="#3a2c20" stroke-width="4.5"/>
      <ellipse cx="48" cy="152" rx="2.5" ry="4" fill="#3a2c20"/>
      <ellipse cx="52" cy="155" rx="2.5" ry="4" fill="#3a2c20"/>
