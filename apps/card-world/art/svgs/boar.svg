      <path d="M 155,158 Q 180,170 170,222 L 156,223 Q 148,198 142,178 Z" fill="url(#b_body)" stroke="#3a2c20" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 158,214 L 168,223 L 155,223 Z" fill="#3a2c20"/>
      <!-- 近侧粗壮前腿 -->
      <path d="M 108,162 Q 115,185 110,222 L 98,223 Q 95,195 95,178 Z" fill="url(#b_body)" stroke="#3a2c20" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 100,214 L 110,223 L 97,223 Z" fill="#3a2c20"/>
      <!-- 小蜷曲野猪尾 -->
      <path d="M 195,142 Q 212,145 208,155 Q 202,158 200,150" fill="none" stroke="#3a2c20" stroke-width="4.5" stroke-linecap="round"/>
      <!-- 粗大头颅 -->
      <path d="M 105,118 Q 80,122 56,142 C 45,152 48,168 62,170 C 80,172 105,160 115,145 Z" fill="url(#b_body)" stroke="#3a2c20" stroke-width="5.5" stroke-linejoin="round"/>
