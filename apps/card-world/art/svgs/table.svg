<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
      <defs>
        <linearGradient id="tb_wood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#b07d4f"/>
          <stop offset="50%" stop-color="#80532c"/>
          <stop offset="100%" stop-color="#543317"/>
        </linearGradient>
      </defs>
      <!-- 阴影 -->
      <ellipse cx="128" cy="225" rx="95" ry="20" fill="#2d1c14" opacity="0.45"/>
      <!-- 后两桌腿 -->
      <rect x="52" y="135" width="16" height="60" rx="4" fill="#422610" stroke="#3a2c20" stroke-width="4.5"/>
      <rect x="188" y="135" width="16" height="60" rx="4" fill="#422610" stroke="#3a2c20" stroke-width="4.5"/>
      <!-- 前横档拉杆 (Apron/Stretcher) -->
      <rect x="48" y="152" width="160" height="15" rx="3" fill="#633b19" stroke="#3a2c20" stroke-width="4.5"/>
      <!-- 前两粗壮主桌腿 -->
      <rect x="42" y="145" width="20" height="75" rx="4" fill="url(#tb_wood)" stroke="#3a2c20" stroke-width="5.5"/>
      <rect x="194" y="145" width="20" height="75" rx="4" fill="url(#tb_wood)" stroke="#3a2c20" stroke-width="5.5"/>
      <!-- 厚实原木大桌面板 (透视斜面) -->
      <polygon points="20,145 52,98 204,98 236,145" fill="url(#tb_wood)" stroke="#3a2c20" stroke-width="6" stroke-linejoin="round"/>
      <!-- 桌面厚度沿口 -->
      <polygon points="20,145 236,145 236,155 20,155" fill="#543317" stroke="#3a2c20" stroke-width="5" stroke-linejoin="round"/>
      <!-- 桌面原木木纹与拼接缝 -->
      <line x1="78" y1="98" x2="68" y2="145" stroke="#422610" stroke-width="3.5"/>
      <line x1="138" y1="98" x2="135" y2="145" stroke="#422610" stroke-width="3.5"/>
      <line x1="182" y1="98" x2="190" y2="145" stroke="#422610" stroke-width="3.5"/>
      <!-- 桌面上的热气粗陶大碗 -->
      <ellipse cx="128" cy="118" rx="26" ry="12" fill="#d97543" stroke="#3a2c20" stroke-width="4"/>
      <ellipse cx="128" cy="116" rx="22" ry="8" fill="#fadc96"/>
      <!-- 碗口飘出的丝丝白汽 (美味热气) -->
      <path d="M 122,108 C 118,95 125,88 120,75" fill="none" stroke="#fff8ed" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
      <path d="M 134,106 C 138,94 132,86 136,72" fill="none" stroke="#fff8ed" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    </svg>