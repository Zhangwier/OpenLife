<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
      <defs>
        <radialGradient id="ph_head" cx="40%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#3cb371"/>
          <stop offset="60%" stop-color="#1e6b40"/>
          <stop offset="100%" stop-color="#0c3820"/>
        </radialGradient>
        <radialGradient id="ph_body" cx="40%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#e27c38"/>
          <stop offset="60%" stop-color="#b8511d"/>
          <stop offset="100%" stop-color="#732a08"/>
        </radialGradient>
      </defs>
      <!-- 脚底草地 -->
      <ellipse cx="138" cy="225" rx="75" ry="16" fill="#2d1c14" opacity="0.45"/>
      <!-- 修长翘起的绚丽雉尾羽 (向左后方延展) -->
      <path d="M 115,148 C 65,150 25,120 12,85 C 32,108 80,140 125,156 Z" fill="#8c5828" stroke="#3a2c20" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 115,155 C 75,165 40,145 28,118 C 50,135 85,155 125,162 Z" fill="#ba8043" stroke="#3a2c20" stroke-width="4"/>
      <!-- 尾羽上的经典斑马横黑条纹 -->
      <line x1="38" y1="108" x2="48" y2="120" stroke="#3a2c20" stroke-width="3" stroke-linecap="round"/>
      <line x1="62" y1="126" x2="74" y2="138" stroke="#3a2c20" stroke-width="3" stroke-linecap="round"/>
      <line x1="88" y1="142" x2="100" y2="152" stroke="#3a2c20" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 细长爪足 -->
      <!-- 远侧腿 -->
      <path d="M 132,185 L 128,222 M 128,222 L 118,225 M 128,222 L 138,225" stroke="#63452c" stroke-width="4.5" stroke-linecap="round"/>
      <!-- 近侧腿 -->
      <path d="M 152,185 L 150,222 M 150,222 L 138,225 M 150,222 L 160,225" stroke="#3a2c20" stroke-width="5" stroke-linecap="round"/>
      <!-- 丰满圆润的赤褐色躯体 -->
      <path d="M 112,142 C 105,120 135,105 162,112 C 185,118 195,145 185,172 C 172,192 135,192 118,175 Z" fill="url(#ph_body)" stroke="#3a2c20" stroke-width="5.5" stroke-linejoin="round"/>
      <!-- 翅膀羽毛层叠花纹 -->
      <path d="M 132,132 C 155,130 178,145 168,172 C 152,178 135,165 132,132 Z" fill="#d99b59" stroke="#3a2c20" stroke-width="4"/>
      <path d="M 142,142 Q 160,150 155,165" stroke="#3a2c20" stroke-width="3" fill="none"/>
      <!-- 纯白颈环 (Ring-neck) -->
      <path d="M 160,105 Q 175,108 178,98" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <path d="M 160,105 Q 175,108 178,98" stroke="#3a2c20" stroke-width="2" stroke-linecap="round"/>
      <!-- 翠绿昂然的头颈 -->
      <path d="M 165,108 C 160,95 165,75 178,65 C 190,56 206,62 208,75 C 208,90 188,108 172,112 Z" fill="url(#ph_head)" stroke="#3a2c20" stroke-width="5" stroke-linejoin="round"/>
      <!-- 鲜艳醒目的赤红眼周肉垂 -->
      <ellipse cx="190" cy="70" rx="9" ry="7" fill="#dc2626" stroke="#3a2c20" stroke-width="2.5"/>
      <circle cx="190" cy="70" r="2.5" fill="#facc15"/>
      <circle cx="190" cy="70" r="1.2" fill="#3a2c20"/>
      <!-- 尖锐浅色鸟喙 -->
      <polygon points="208,72 225,75 208,80" fill="#fae8b2" stroke="#3a2c20" stroke-width="3" stroke-linejoin="round"/>
    </svg>