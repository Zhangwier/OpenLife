<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
      <defs>
        <radialGradient id="pt_rim" cx="50%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#b88358"/>
          <stop offset="60%" stop-color="#80502b"/>
          <stop offset="100%" stop-color="#4a2a12"/>
        </radialGradient>
      </defs>
      <!-- 外沿地面 -->
      <ellipse cx="128" cy="145" rx="105" ry="75" fill="url(#pt_rim)" stroke="#3a2c20" stroke-width="6.5"/>
      <!-- 阶梯状挖掘下沉斜坡断层 -->
      <ellipse cx="128" cy="155" rx="85" ry="58" fill="#693d1c" stroke="#3a2c20" stroke-width="5"/>
      <!-- 坑底湿润蓄水洼 (带清亮反光) -->
      <ellipse cx="128" cy="168" rx="60" ry="36" fill="#3a6970" stroke="#3a2c20" stroke-width="4.5"/>
      <ellipse cx="128" cy="168" rx="48" ry="26" fill="#4d8b94"/>
      <ellipse cx="120" cy="165" rx="22" ry="8" fill="#7ecfd6" opacity="0.6"/>
      <!-- 挖掘铲凿痕迹与湿泥块堆 -->
      <path d="M 58,125 Q 75,145 92,125" stroke="#3a2c20" stroke-width="3.5" fill="none"/>
      <path d="M 165,125 Q 182,145 198,125" stroke="#3a2c20" stroke-width="3.5" fill="none"/>
      <!-- 坑沿散落的新鲜红黏土堆 -->
      <ellipse cx="62" cy="175" rx="18" ry="12" fill="#c4683d" stroke="#3a2c20" stroke-width="4"/>
      <ellipse cx="198" cy="165" rx="16" ry="10" fill="#c4683d" stroke="#3a2c20" stroke-width="4"/>
    </svg>