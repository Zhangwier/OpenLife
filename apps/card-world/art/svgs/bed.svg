<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
      <defs>
        <linearGradient id="bd_wood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#8a5a36"/>
          <stop offset="50%" stop-color="#5a341a"/>
          <stop offset="100%" stop-color="#3d210e"/>
        </linearGradient>
        <radialGradient id="bd_fur" cx="45%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#d49255"/>
          <stop offset="70%" stop-color="#a6632c"/>
          <stop offset="100%" stop-color="#693712"/>
        </radialGradient>
      </defs>
      <!-- 地面阴影 -->
      <ellipse cx="128" cy="222" rx="98" ry="22" fill="#2d1c14" opacity="0.4"/>
      <!-- 后方床腿 -->
      <rect x="52" y="145" width="14" height="45" rx="4" fill="#3d210e" stroke="#3a2c20" stroke-width="4.5"/>
      <rect x="190" y="130" width="14" height="45" rx="4" fill="#3d210e" stroke="#3a2c20" stroke-width="4.5"/>
      <!-- 粗原木床侧框架 -->
      <polygon points="40,150 205,130 220,150 55,175" fill="url(#bd_wood)" stroke="#3a2c20" stroke-width="5" stroke-linejoin="round"/>
      <!-- 铺底干草层 (金黄蓬松带毛刺) -->
      <path d="M 45,148 C 50,135 195,115 210,128 C 220,135 220,155 205,160 C 180,165 60,178 45,170 C 38,162 40,152 45,148 Z" fill="#e5b85d" stroke="#3a2c20" stroke-width="4.5"/>
      <!-- 干草细茎纹理 -->
      <path d="M 42,160 L 32,156 M 46,168 L 36,172 M 52,174 L 46,182 M 205,145 L 216,140 M 212,152 L 222,155" stroke="#be8e32" stroke-width="3" stroke-linecap="round"/>
      <!-- 厚实保暖的大兽皮被褥 -->
      <path d="M 65,138 C 75,122 170,110 190,122 C 205,130 195,168 175,175 C 130,185 80,180 65,168 C 58,155 60,145 65,138 Z" fill="url(#bd_fur)" stroke="#3a2c20" stroke-width="5.5" stroke-linejoin="round"/>
      <!-- 兽皮边缘白色毛绒包边 -->
      <path d="M 65,168 Q 120,182 175,175" fill="none" stroke="#fff5e4" stroke-width="6" stroke-linecap="round"/>
      <path d="M 65,168 Q 120,182 175,175" fill="none" stroke="#3a2c20" stroke-width="2" stroke-dasharray="4 6"/>
      <!-- 兽皮折痕与斑纹 -->
      <path d="M 90,142 Q 130,152 165,140" fill="none" stroke="#522709" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M 105,158 Q 135,165 155,158" fill="none" stroke="#522709" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <!-- 兽皮上的野性黑斑 -->
      <ellipse cx="110" cy="142" rx="6" ry="4" fill="#3b1b06" opacity="0.75"/>
      <ellipse cx="145" cy="136" rx="7" ry="4.5" fill="#3b1b06" opacity="0.75"/>
      <ellipse cx="130" cy="155" rx="6.5" ry="4" fill="#3b1b06" opacity="0.75"/>
      <!-- 柔软兽皮卷枕 -->
      <ellipse cx="80" cy="135" rx="22" ry="12" fill="#edd4b4" stroke="#3a2c20" stroke-width="4.5"/>
      <ellipse cx="70" cy="135" rx="6" ry="10" fill="#c9a881" stroke="#3a2c20" stroke-width="3"/>
      <!-- 前方床腿 -->
      <rect x="52" y="170" width="16" height="48" rx="4" fill="url(#bd_wood)" stroke="#3a2c20" stroke-width="5"/>
      <rect x="185" y="155" width="16" height="48" rx="4" fill="url(#bd_wood)" stroke="#3a2c20" stroke-width="5"/>
    </svg>