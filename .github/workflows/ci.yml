name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Design tokens (字号阶梯 / 硬编码颜色)
        run: npm run design:check
      - name: Module catalog is up to date
        run: npm run catalog:check
      - name: Type-check ratchet (no new TypeScript errors)
        run: npm run typecheck
      - name: Smoke - modern-world demo
        run: npm run demo
      - name: Smoke - magic-test-world demo
        run: npm run demo:magic
